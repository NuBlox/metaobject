name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Typecheck, build and test
        run: npm run check

  package-consumer:
    name: package and clean consumer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify package contents
        run: npm run verify:package

      - name: Verify clean consumer
        run: npm run verify:consumer

  mysql-adapter-consumer:
    name: MySQL adapter clean consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/storage-mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install adapter build dependencies
        run: npm install

      - name: Verify packed adapter in a clean external consumer
        run: npm run verify:consumer

  mysql-storage-adapter:
    name: MySQL ${{ matrix.mysql }} persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: "mysql:${{ matrix.mysql }}"
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: metaobject_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: metaobject_test
    defaults:
      run:
        working-directory: packages/storage-mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install adapter dependencies
        run: npm install

      - name: Typecheck, unit test and verify package
        run: npm run check

      - name: Instrument race error diagnostic
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/mysql-conformance.test.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const target = 'assert.equal(raceRejected[0].reason?.name, "ConcurrencyError");';
          const diagnostic = `const raceReason = raceRejected[0].reason;
              console.error("RACE_ERROR_DIAGNOSTIC", JSON.stringify({
                name: raceReason?.name,
                message: raceReason?.message,
                code: raceReason?.code,
                category: raceReason?.category,
                retryable: raceReason?.retryable,
                causeName: raceReason?.cause?.name,
                causeMessage: raceReason?.cause?.message,
                causeCode: raceReason?.cause?.code,
              }));
              ${target}`;
          if (!source.includes(target)) throw new Error('Race assertion target not found');
          fs.writeFileSync(path, source.replace(target, diagnostic));
          NODE

      - name: Run MetaObject persistence conformance against MySQL
        run: npm run test:integration

      - name: Run M74 certification stress gate
        env:
          M74_DATASET_SIZE: 1200
          M74_PARALLEL_READS: 400
          M74_CONTENTION_WRITERS: 32
          M74_MIGRATION_INITIALIZERS: 16
          M74_MAX_SEED_MS: 30000
          M74_MAX_QUERY_MATRIX_MS: 15000
          M74_MAX_PARALLEL_READ_MS: 15000
          M74_MAX_CONTENTION_MS: 20000
          M74_MAX_MIGRATION_STAMPEDE_MS: 20000
        run: npm run test:certification
